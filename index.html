<!DOCTYPE html>
<html lang="fi" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sensoripaja — Temperature Sensor Telemetry</title>
  <meta name="description" content="Minimalist real-time water temperature sensor visualization from api.sensoripaja.fi (Helsinki & Espoo monitoring stations)." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <div class="brand-group">
        <div class="brand-title-row">
          <span class="status-dot" id="live-indicator" title="Fetching live telemetry from api.sensoripaja.fi"></span>
          <h1 class="brand-title">Sensoripaja</h1>
          <span class="brand-subtitle">Temperature Telemetry</span>
        </div>
        <div class="meta-status" id="status-summary">
          Connecting to api.sensoripaja.fi…
        </div>
      </div>

      <div class="controls-bar">
        <!-- Region Filter -->
        <div class="segmented-control" role="group" aria-label="Region filter" id="region-picker">
          <button type="button" class="seg-btn active" data-region="all">All <span class="count-badge" id="count-all">–</span></button>
          <button type="button" class="seg-btn" data-region="swimhelsinki">Helsinki <span class="count-badge" id="count-swimhelsinki">–</span></button>
          <button type="button" class="seg-btn" data-region="swimespoo">Espoo <span class="count-badge" id="count-swimespoo">–</span></button>
        </div>

        <!-- Time Range Picker: Week, Month, 3M, 6M, YTD, 1Y, 2Y, All -->
        <div class="segmented-control time-picker" role="group" aria-label="Time range picker" id="range-picker">
          <button type="button" class="seg-btn active" data-range="week" title="Last 7 days">1W</button>
          <button type="button" class="seg-btn" data-range="month" title="Last 30 days">1M</button>
          <button type="button" class="seg-btn" data-range="3m" title="Last 3 months">3M</button>
          <button type="button" class="seg-btn" data-range="6m" title="Last 6 months">6M</button>
          <button type="button" class="seg-btn" data-range="ytd" title="Year to date">YTD</button>
          <button type="button" class="seg-btn" data-range="1y" title="Last 1 year">1Y</button>
          <button type="button" class="seg-btn" data-range="2y" title="Last 2 years">2Y</button>
          <button type="button" class="seg-btn" data-range="all" title="All available data">All</button>
        </div>

        <!-- Secondary tools: search, sort, theme -->
        <div class="utility-controls">
          <div class="search-wrap">
            <input
              type="search"
              id="station-search"
              class="search-input"
              placeholder="Filter stations…"
              aria-label="Filter stations by name"
              autocomplete="off"
            />
          </div>

          <select id="sort-select" class="minimal-select" aria-label="Sort stations">
            <option value="name">Sort: A–Z</option>
            <option value="temp-desc">Sort: Warmest</option>
            <option value="temp-asc">Sort: Coldest</option>
            <option value="updated">Sort: Latest</option>
          </select>

          <button type="button" id="refresh-btn" class="icon-btn" title="Refresh sensor data" aria-label="Refresh sensor data">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
              <path d="M3 3v5h5"/>
              <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
              <path d="M16 16h5v5"/>
            </svg>
          </button>

          <button type="button" id="theme-btn" class="icon-btn" title="Toggle light/dark mode" aria-label="Toggle light/dark mode">
            <svg class="icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="4"/>
              <path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
            </svg>
            <svg class="icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
    <div class="loading-bar-track" id="loading-track">
      <div class="loading-bar-fill" id="loading-fill"></div>
    </div>
  </header>

  <main class="container main-content">
    <!-- Combined Single-View Multi-Sensor Chart -->
    <section class="panel overview-panel" id="overview-section" aria-label="Combined multi-sensor temperature chart">
      <div class="panel-header">
        <div class="panel-title-group">
          <h2 class="panel-title">All Sensors — Combined View</h2>
          <span class="panel-caption" id="overview-caption">Each sensor plotted with a unique color</span>
        </div>
        <div class="panel-actions">
          <button type="button" class="text-btn" id="reset-highlight-btn" hidden>Show all sensors</button>
          <button type="button" class="text-btn" id="toggle-overview-btn" title="Collapse or expand combined chart">Hide combined chart</button>
        </div>
      </div>

      <div class="overview-body" id="overview-body">
        <div class="overview-chart-wrap">
          <canvas id="overview-canvas" class="chart-canvas overview-canvas"></canvas>
          <div id="overview-tooltip" class="chart-tooltip overview-tooltip" hidden></div>
        </div>
        <div class="sensor-legend" id="sensor-legend" aria-label="Sensor color legend"></div>
      </div>
    </section>

    <!-- Per-Station Stacked Views -->
    <section class="stations-section" aria-label="Station temperature charts">
      <div class="section-bar">
        <div class="section-bar-left">
          <h2 class="section-heading">Stations</h2>
          <span class="section-meta" id="stations-count-label">Loading stations…</span>
        </div>
        <div class="section-bar-right">
          <label class="checkbox-pill">
            <input type="checkbox" id="hide-storage-toggle" />
            <span>Hide sensors in winter storage</span>
          </label>
          <div class="segmented-control compact" role="group" aria-label="Layout density" id="layout-picker">
            <button type="button" class="seg-btn active" data-layout="stack" title="Single column stacked view">Stacked</button>
            <button type="button" class="seg-btn" data-layout="grid" title="Two-column compact grid">Grid</button>
          </div>
        </div>
      </div>

      <div id="error-banner" class="error-banner" hidden></div>
      <div id="stations-list" class="stations-list layout-stack"></div>
    </section>
  </main>

  <footer class="container footer">
    <div class="footer-inner">
      <span>Data source: <a href="https://api.sensoripaja.fi" target="_blank" rel="noopener">api.sensoripaja.fi</a> (<a href="https://api.sensoripaja.fi/swimhelsinki/featurecollection.geojson" target="_blank" rel="noopener">swimhelsinki</a> &amp; <a href="https://api.sensoripaja.fi/swimespoo/featurecollection.geojson" target="_blank" rel="noopener">swimespoo</a>)</span>
      <span id="last-sync-label"></span>
    </div>
  </footer>

  <script src="./app.js" defer></script>
</body>
</html>
